{% extends "base.html" %}
{% block title %}Регистрация — AccessEvent{% endblock %}
{% block content %}
<div class="form-container">
    <h1>Регистрация</h1>
    {% if error %}<div class="notification notification-error">{{ error }}</div>{% endif %}
    <form method="POST">
        <div class="form-group"><label>Имя пользователя:</label><input type="text" name="username" required></div>
        <div class="form-group"><label>Email:</label><input type="email" name="email" required></div>
        <div class="form-group"><label>Пароль (мин. 8):</label><input type="password" name="password" minlength="8" required></div>
        <div class="form-group"><label>Роль:</label>
            <select name="role"><option value="user">Участник</option><option value="organizer">Организатор</option></select>
        </div>
        <div class="form-group checkbox-group">
            <input type="checkbox" name="is_deaf" value="true" id="is_deaf"><label for="is_deaf">Я глухой или слабослышащий</label>
        </div>
        <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
    </form>
</div>
{% endblock %}
