{% extends "base.html" %}
{% block title %}Вход — AccessEvent{% endblock %}
{% block content %}
<div class="form-container">
    <h1>Вход</h1>
    {% if error %}<div class="notification notification-error">{{ error }}</div>{% endif %}
    <form method="POST">
        <div class="form-group"><label>Email:</label><input type="email" name="email" required></div>
        <div class="form-group"><label>Пароль:</label><input type="password" name="password" required></div>
        <button type="submit" class="btn btn-primary">Войти</button>
    </form>
    <p style="text-align:center; margin-top:15px;">Нет аккаунта? <a href="{{ url_for('register_page') }}">Зарегистрируйтесь</a></p>
</div>
{% endblock %}
