services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql+psycopg2://accessevent:accessevent@postgres:5432/accessevent
      SECRET_KEY: ${SECRET_KEY:-local-development-change-me}
      JWT_SECRET: ${JWT_SECRET:-local-jwt-change-me}
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: accessevent
      POSTGRES_USER: accessevent
      POSTGRES_PASSWORD: accessevent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accessevent -d accessevent"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
