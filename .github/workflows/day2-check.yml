name: Day 2 Check

on: [push, pull_request]

jobs:
  check-day2:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check required documentation
        run: |
          for f in docs/schema.sql docs/security.md docs/architecture.md docs/er_diagram.png; do test -f "$f" || exit 1; done
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Execute DDL
        env:
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d testdb -f docs/schema.sql
      - name: Verify tables and foreign keys
        env:
          PGPASSWORD: postgres
        run: |
          tables=$(psql -h localhost -U postgres -d testdb -t -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE';")
          fks=$(psql -h localhost -U postgres -d testdb -t -c "SELECT count(*) FROM information_schema.table_constraints WHERE constraint_type='FOREIGN KEY' AND table_schema='public';")
          echo "Tables: $tables; foreign keys: $fks"
          test "$tables" -ge 5
          test "$fks" -ge 5
      - name: Verify roles and security documentation
        run: |
          for role in guest user organizer admin; do grep -qi "$role" docs/security.md || exit 1; done
          grep -qi "JWT" docs/security.md
          grep -qi "хеш" docs/security.md
      - run: echo "All Day 2 checks passed"
