name: Day 2 - Database and Security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Check Day 2 files
        shell: bash
        run: |
          set -euo pipefail
          for file in docs/schema.sql docs/security.md docs/architecture.md docs/er_diagram.png; do
            test -s "$file" || { echo "::error::Missing or empty file: $file"; exit 1; }
          done
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Execute schema
        env:
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d testdb -f docs/schema.sql
      - name: Verify tables and foreign keys
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          set -euo pipefail
          tables="$(psql -At -h 127.0.0.1 -U postgres -d testdb -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE';")"
          fks="$(psql -At -h 127.0.0.1 -U postgres -d testdb -c "SELECT count(*) FROM information_schema.table_constraints WHERE constraint_type='FOREIGN KEY' AND table_schema='public';")"
          echo "Tables=$tables foreign_keys=$fks"
          (( tables >= 7 )) || { echo "::error::Expected at least 7 tables"; exit 1; }
          (( fks >= 5 )) || { echo "::error::Expected at least 5 foreign keys"; exit 1; }
      - name: Verify security documentation
        shell: bash
        run: |
          set -euo pipefail
          for role in guest user organizer admin; do
            grep -Eiq "(^|[^[:alnum:]_])${role}([^[:alnum:]_]|$)" docs/security.md || { echo "::error::Role missing: ${role}"; exit 1; }
          done
          grep -Eiq "JWT" docs/security.md
          grep -Eiq "хеш" docs/security.md
      - name: Finish
        run: echo Day-2-checks-passed
