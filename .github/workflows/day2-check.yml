name: Day 2 Check

on:
  push:
    paths:
      - ".github/workflows/day2-check.yml"
      - "docs/schema.sql"
      - "docs/security.md"
      - "docs/architecture.md"
      - "docs/er_diagram.png"
  pull_request:
    paths:
      - ".github/workflows/day2-check.yml"
      - "docs/schema.sql"
      - "docs/security.md"
      - "docs/architecture.md"
      - "docs/er_diagram.png"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-day2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required documentation
        shell: bash
        run: |
          set -euo pipefail
          for file in docs/schema.sql docs/security.md docs/architecture.md docs/er_diagram.png; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Required file is missing or empty: $file"
              exit 1
            fi
          done

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Execute database schema
        env:
          PGPASSWORD: postgres
        run: |
          psql --set ON_ERROR_STOP=1             --host 127.0.0.1 --username postgres --dbname testdb             --file docs/schema.sql

      - name: Verify tables and foreign keys
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          set -euo pipefail
          tables="$(psql -At --host 127.0.0.1 --username postgres --dbname testdb             --command "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE';")"
          foreign_keys="$(psql -At --host 127.0.0.1 --username postgres --dbname testdb             --command "SELECT count(*) FROM information_schema.table_constraints WHERE constraint_type='FOREIGN KEY' AND table_schema='public';")"

          echo "Tables created: $tables"
          echo "Foreign keys created: $foreign_keys"
          [[ "$tables" =~ ^[0-9]+$ ]] || { echo "::error::Could not read table count"; exit 1; }
          [[ "$foreign_keys" =~ ^[0-9]+$ ]] || { echo "::error::Could not read foreign-key count"; exit 1; }
          (( tables >= 5 ))
          (( foreign_keys >= 5 ))

      - name: Verify roles and security documentation
        shell: bash
        run: |
          set -euo pipefail
          for role in guest user organizer admin; do
            grep -Eiq "(^|[^[:alnum:]_])${role}([^[:alnum:]_]|$)" docs/security.md || {
              echo "::error::Role '$role' is missing from docs/security.md"
              exit 1
            }
          done
          grep -Eiq "JWT" docs/security.md
          grep -Eiq "хеш" docs/security.md

      - name: Finish
        run: echo All-Day-2-checks-passed
