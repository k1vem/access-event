name: Day3 Backend Check
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: |
          test -f app.py && test -f config.py && test -f models.py
          test -f routes/auth.py && test -f routes/events.py && test -f utils/auth_helpers.py
      - run: python -m py_compile app.py config.py models.py routes/*.py utils/*.py