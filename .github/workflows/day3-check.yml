name: Day 3 - Backend and API Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TESTING: "1"
      SECRET_KEY: "test-secret-key-must-be-32-bytes-or-more-12345"
      JWT_SECRET: "test-jwt-secret-must-be-32-bytes-or-more-12345"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Verify backend files
        run: |
          set -eu
          for f in app.py config.py models.py routes/auth.py routes/events.py routes/registrations.py routes/communication.py utils/auth_helpers.py utils/accessibility.py tests/conftest.py tests/test_api.py tests/test_models.py; do
            test -f "$f" || { echo "Missing required file: $f"; exit 1; }
          done
      - name: Compile Python
        run: python -m compileall -q app.py config.py models.py routes utils tests
      - name: Run tests
        run: python -m pytest -q
