name: Docker Build Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (without publishing)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
