name: Day 4 - Frontend and Docker

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TESTING: "1"
      SECRET_KEY: "test-secret-key-must-be-32-bytes-or-more-12345"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check frontend and Docker deliverables
        shell: bash
        run: |
          set -euo pipefail
          for file in templates/base.html templates/index.html templates/events.html templates/login.html templates/register.html templates/profile.html templates/dashboard.html templates/event_detail.html static/css/style.css static/js/main.js Dockerfile docker-compose.yml .dockerignore; do
            test -s "$file" || { echo "::error::Missing or empty file: $file"; exit 1; }
          done
          test "$(wc -c < static/css/style.css)" -ge 300
          test "$(wc -c < static/js/main.js)" -ge 200
          grep -q '@media' static/css/style.css
          grep -q 'showNotification' static/js/main.js
          grep -q '^FROM' Dockerfile
          grep -q '^COPY' Dockerfile
          grep -q '^CMD' Dockerfile
          grep -q 'services:' docker-compose.yml
          grep -q 'postgres' docker-compose.yml
          grep -q 'ghcr.io' .github/workflows/docker-publish.yml
      - name: Compile application
        run: python -m compileall -q app.py config.py models.py routes utils
      - name: Render main pages
        run: |
          python - <<'PY'
          from app import create_app
          client = create_app().test_client()
          for path in ("/", "/events", "/login", "/register", "/profile", "/dashboard"):
              response = client.get(path)
              assert response.status_code == 200, f"{path}: HTTP {response.status_code}"
              print(f"PASS {path}")
          health = client.get("/health")
          assert health.status_code == 200 and health.get_json().get("status") == "ok"
          PY
