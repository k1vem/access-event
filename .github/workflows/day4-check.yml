name: Day 4 Frontend and Docker Check
on: [push, pull_request]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Check templates and static assets
        run: |
          for f in templates/base.html templates/index.html templates/events.html templates/login.html templates/register.html templates/profile.html static/css/style.css static/js/main.js Dockerfile docker-compose.yml .dockerignore; do test -f "$f" || exit 1; done
          test "$(wc -c < static/css/style.css)" -ge 300
          test "$(wc -c < static/js/main.js)" -ge 200
          grep -q "@media" static/css/style.css
          grep -q "showNotification" static/js/main.js
          grep -l "aria-label" templates/*.html
          grep -l "role=" templates/*.html
          grep -q "^FROM" Dockerfile
          grep -q "^COPY" Dockerfile
          grep -q "^CMD" Dockerfile
          grep -q "services:" docker-compose.yml
          grep -q "postgres" docker-compose.yml
      - name: Compile app
        run: python -m py_compile app.py
      - name: Render main pages
        env:
          TESTING: "1"
          SECRET_KEY: "test-secret-key-must-be-32-bytes-or-more-12345"
        run: |
          python - <<'PY'
          from app import create_app
          app = create_app()
          client = app.test_client()
          for path in ("/", "/events", "/login", "/register", "/profile"):
              response = client.get(path)
              assert response.status_code == 200, (path, response.status_code)
          print("All HTML pages render")
          PY
