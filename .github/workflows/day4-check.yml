name: Day 4 - Frontend and Docker

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check frontend and container files
        run: |
          set -eu
          for f in templates/index.html templates/events.html templates/login.html templates/register.html static/css/style.css static/js/main.js Dockerfile docker-compose.yml .dockerignore; do
            test -f "$f" || { echo "Missing $f"; exit 1; }
          done
          grep -q '^FROM ' Dockerfile
          grep -q '^CMD ' Dockerfile
          grep -q 'services:' docker-compose.yml
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q app.py config.py models.py routes utils