name: Day 4 - Frontend and Docker

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TESTING: "1"
      SECRET_KEY: "test-secret-key-must-be-32-bytes-or-more-12345"
      JWT_SECRET: "test-jwt-secret-must-be-32-bytes-or-more-12345"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check actual frontend and Docker files
        run: |
          set -eu
          for f in templates/base.html templates/index.html templates/events.html templates/login.html templates/register.html templates/profile.html templates/dashboard.html templates/event_detail.html templates/create_event.html static/css/style.css static/js/main.js static/day4/index.html static/day4/style.css static/day4/script.js Dockerfile docker-compose.yml .dockerignore; do
            test -f "$f" || { echo "Missing required file: $f"; exit 1; }
          done
      - name: Check HTML, CSS and JavaScript are non-empty
        run: |
          set -eu
          test -s templates/base.html
          test -s templates/index.html
          test -s static/css/style.css
          test -s static/js/main.js
          test -s static/day4/index.html
          test -s static/day4/style.css
          test -s static/day4/script.js
          grep -q '^FROM ' Dockerfile
          grep -q '^services:' docker-compose.yml
      - name: Compile application
        run: python -m compileall -q app.py routes models.py utils
      - name: Check pages render
        run: |
          python - <<'PY'
          from app import create_app
          app = create_app()
          client = app.test_client()
          for path in ("/", "/events", "/login", "/register", "/dashboard", "/profile"):
              response = client.get(path)
              assert response.status_code == 200, f"{path}: {response.status_code}"
          print("All checked pages rendered successfully.")
          PY
