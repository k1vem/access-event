name: Day5 Check
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: |
          test -f tests/conftest.py && test -f tests/test_models.py && test -f tests/test_api.py
          test -f docs/test_cases.md && test -f docs/bug_reports.md
      - env:
          TESTING: "1"
          SECRET_KEY: "test-secret-key-must-be-32-bytes-or-more-12345"
        run: pytest -v