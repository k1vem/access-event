name: Day 5 Tests and Documentation
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Check tests and docs
        run: |
          for f in tests/conftest.py tests/test_models.py tests/test_api.py docs/test_cases.md docs/bug_reports.md docs/user_manual.md docs/admin_manual.md docs/api.md docs/assessment.md; do test -f "$f" || exit 1; done
      - name: Run tests
        env:
          TESTING: "1"
          SECRET_KEY: "test-secret-key-must-be-32-bytes-or-more-12345"
        run: python -m pytest -v
