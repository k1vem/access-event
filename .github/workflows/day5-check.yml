name: Day 5 - Tests and Documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TESTING: "1"
      SECRET_KEY: "test-secret-key-must-be-32-bytes-or-more-12345"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check test and documentation files
        shell: bash
        run: |
          set -euo pipefail
          for file in tests/conftest.py tests/test_models.py tests/test_api.py docs/test_cases.md docs/bug_reports.md docs/user_manual.md docs/admin_manual.md docs/api.md docs/assessment.md; do
            test -s "$file" || { echo "::error::Missing or empty file: $file"; exit 1; }
          done
      - name: Run model and API tests
        run: python -m pytest -v
