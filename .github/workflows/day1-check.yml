name: Day 1 - Requirements and Analysis

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  requirements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required deliverables
        shell: bash
        run: |
          set -euo pipefail
          for file in README.md docs/analysis.md docs/requirements.md docs/tz.md docs/stakeholders.md; do
            test -s "$file" || { echo "::error::Missing or empty file: $file"; exit 1; }
          done
      - name: Check functional and non-functional requirements
        shell: bash
        run: |
          set -euo pipefail
          fr_count="$(grep -Ec '^FR-[0-9]+' docs/requirements.md || true)"
          nfr_count="$(grep -Ec '^NFR-[0-9]+' docs/requirements.md || true)"
          us_count="$(grep -Ec '^US-[0-9]+' docs/requirements.md || true)"
          echo "FR=$fr_count NFR=$nfr_count US=$us_count"
          (( fr_count >= 15 )) || { echo "::error::Expected at least 15 functional requirements"; exit 1; }
          (( nfr_count >= 8 )) || { echo "::error::Expected at least 8 non-functional requirements"; exit 1; }
          (( us_count >= 15 )) || { echo "::error::Expected at least 15 user stories"; exit 1; }
      - name: Check technical specification sections
        shell: bash
        run: |
          set -euo pipefail
          for section in "Назначение" "предметной области" "Требования к функциям" "Требования к качеству" "интерфейсу" "данным" "технологический стек" "Ограничения"; do
            grep -qi "$section" docs/tz.md || { echo "::error::Missing TZ section: $section"; exit 1; }
          done
      - name: Finish
        run: echo Day-1-checks-passed
